backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "en"

collections:
  - name: "content"
    label: "Сайтын мэдээлэл"
    files:
      - name: "site"
        label: "Нүүр хуудсны текстүүд"
        file: "content.json"
        fields:
          - { label: "Дээд мэдэгдэл (жишээ: Пүрэв гараг бүр 19:00)", name: "pill", widget: "string" }
          - { label: "Гол гарчиг", name: "hero_title", widget: "text" }
          - { label: "Гол тайлбар", name: "hero_lead", widget: "text" }
          - { label: "YouTube сувгийн холбоос", name: "youtube_url", widget: "string" }
          - { label: "YouTube playlist хуудасны холбоос", name: "playlist_url", widget: "string" }
          - { label: "ОНЦЛОХ дугаарын видео ID (=-ийн ард 11 тэмдэгт)", name: "featured_id", widget: "string", required: false }
          - { label: "Онцлох дугаарын гарчиг", name: "featured_title", widget: "string" }
          - { label: "Онцлох дугаарын тайлбар", name: "featured_desc", widget: "text" }
          - label: "Статистик (3 ширхэг)"
            name: "stats"
            widget: "list"
            max: 3
            fields:
              - { label: "Тоо/үг", name: "big", widget: "string" }
              - { label: "Тайлбар", name: "small", widget: "string" }
          - label: "Сэдвүүд (3 ширхэг)"
            name: "topics"
            widget: "list"
            max: 3
            fields:
              - { label: "Гарчиг", name: "title", widget: "string" }
              - { label: "Тайлбар", name: "desc", widget: "text" }
          - { label: "Эмчээс асуух → коммент холбоос", name: "comment_url", widget: "string" }
          - { label: "Эмчээс асуух → тэмдэглэл", name: "comment_note", widget: "string" }
          - { label: "Эмчийн нэр", name: "host_name", widget: "string" }
          - { label: "Эмчийн үүрэг", name: "host_role", widget: "string" }
          - { label: "Эмчийн танилцуулга", name: "host_bio", widget: "text" }
          - { label: "Утас (WhatsApp)", name: "phone", widget: "string" }
          - { label: "И-мэйл", name: "email", widget: "string" }
          - { label: "Facebook нэр", name: "facebook_name", widget: "string" }
          - { label: "Facebook хуудасны холбоос", name: "facebook_url", widget: "string" }
          - { label: "Instagram нэр", name: "instagram", widget: "string" }
